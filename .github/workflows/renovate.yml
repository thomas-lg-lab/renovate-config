# The one self-hosted Renovate runner of thomas-lg-lab.
#
# It runs as the `thomas-lg-lab-renovate` GitHub App (not GITHUB_TOKEN: pull requests opened with the workflow token
# never trigger other workflows, so required checks would stay pending and nothing could merge). The App token only
# sees the repositories the App is installed on, and autodiscover takes exactly those: installing the App on a
# repository is what enrols it. A repository without a renovate.json gets an onboarding PR extending this preset.
#
# The App needs Contents, Pull requests, Issues, Workflows, Checks and Commit statuses read & write, plus Metadata,
# Administration and Dependabot alerts read (Renovate docs, "Running as a GitHub App"; the installation grants no
# organisation permission, Members read included, and Renovate runs without it). The token minted below asks for exactly those: a token inherits every permission of the installation
# otherwise, more than a compromised step here should hold. Its Client ID and private key live in the
# RENOVATE_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY secrets of this repository.
#
# Every action and the Renovate image are pinned by full SHA / digest (this job holds the App private key and a
# write token on every enrolled repository); Renovate keeps the pins and their version comments current.
#
# The cron is daily so Dependency Dashboard checkboxes and rebases are picked up quickly; new update PRs are gated
# to Mondays by the schedule in default.json. The whole day, not an early window: GitHub starts this scheduled run
# six to eight hours after 01:00 UTC, and a window that closed at 6:00 in Paris was missed every week.
#
# Renovate merges a pull request itself (automerge with platformAutomerge off) on the run after the one that saw
# its checks green, so one run never opens and merges. With `secondPass`, a dispatched run waits for the checks of
# the Renovate pull requests of the listed repositories and runs again: an image published on main reaches its
# deployment repository within minutes instead of two daily runs. The shared image workflow dispatches it that way.
name: Renovate

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (no PR, no commit)"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info
      repositories:
        description: "Limit to these repositories (comma-separated owner/name), empty = every enrolled one"
        type: string
        default: ""
      secondPass:
        description: "Wait for the checks of the Renovate pull requests of these repositories, then run again so they merge"
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Below the one-hour lifetime of the installation token.
    timeout-minutes: 50
    permissions:
      contents: read
    # Renovate's settings, for both runs below (the action hands RENOVATE_* and LOG_LEVEL to its container).
    env:
      RENOVATE_AUTODISCOVER: ${{ inputs.repositories == '' && 'true' || 'false' }}
      RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository_owner }}/*"
      RENOVATE_REPOSITORIES: ${{ inputs.repositories }}
      RENOVATE_ONBOARDING: "true"
      RENOVATE_ONBOARDING_CONFIG: '{"$schema": "https://docs.renovatebot.com/renovate-schema.json", "extends": ["github>${{ github.repository }}"]}'
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_PLATFORM_COMMIT: enabled
      RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
      LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

    steps:
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Every repository of the installation (autodiscover), the permissions Renovate documents and nothing more.
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: write
          permission-statuses: write
          permission-metadata: read
          permission-administration: read
          permission-vulnerability-alerts: read

      - name: Run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          # Without it the action runs the floating ghcr.io/renovatebot/renovate:44. Renovate's github-actions manager
          # reads this input and bumps tag and digest together.
          renovate-image: ghcr.io/renovatebot/renovate:44.264.1@sha256:35777dd4aa87beee05ba64c7728a2c5e3c70687fdb654909710bac93c697efd1
          token: ${{ steps.app-token.outputs.token }}

      # Second pass, on request: the run above opened or updated pull requests whose checks have only just started.
      # Wait for them (a failed check only warns: that pull request stays open), then run again so Renovate merges
      # the green ones. Needs the list of repositories: waiting on every enrolled one would hold the queue.
      - name: Wait for the checks of the Renovate pull requests
        id: wait
        if: ${{ inputs.secondPass && !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORIES: ${{ inputs.repositories }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ -z "$REPOSITORIES" ]; then
            echo "::notice::secondPass needs the repositories input: no second run."
            exit 0
          fi
          again=false
          IFS=, read -ra repos <<< "$REPOSITORIES"
          for repo in "${repos[@]}"; do
            repo="${repo// /}"
            for pr in $(gh pr list -R "$repo" --author "app/$APP_SLUG" --state open --json number --jq '.[].number'); do
              again=true
              # A new head commit has no check for a few seconds: wait until some are registered, two minutes at most.
              for _ in $(seq 1 12); do
                sleep 10
                [ "$(gh pr checks "$pr" -R "$repo" --json name --jq length 2>/dev/null || echo 0)" -gt 0 ] && break
              done
              timeout 900 gh pr checks "$pr" -R "$repo" --watch --interval 15 \
                || echo "::warning::$repo#$pr: checks failed, missing or still running after 15 minutes."
            done
          done
          echo "again=$again" >> "$GITHUB_OUTPUT"

      - name: Run Renovate again
        if: ${{ steps.wait.outputs.again == 'true' }}
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          renovate-image: ghcr.io/renovatebot/renovate:44.264.1@sha256:35777dd4aa87beee05ba64c7728a2c5e3c70687fdb654909710bac93c697efd1
          token: ${{ steps.app-token.outputs.token }}
